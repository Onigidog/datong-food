<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5EBE0">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>大同食記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;700;800;900&display=swap">
<style>
/* Layout: 單欄手機 app，奶油底＋左上綠色爆炸星、右側點數膠囊、底部綠色懸浮導覽列 */
:root{
  --cream:#F5EBE0; --paper:#FDFAF6; --green:#2F7660; --red:#D84B28;
  --ink:#3B322D; --grey:#BFBAB6; --mute:#8F8781; --blush:#F0C3B0; --desk:#E9DCCD;
  --mland:#EFE5D8; --mblk:#E6D9C8; --mroad:#FDFAF6; --mcase:#DCCDBB; --mcamp:#CFE2D6; --mmkt:#F5D6C7;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Outfit","Noto Sans TC",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);display:flex;justify-content:center}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.app{width:100%;max-width:430px;height:100%;background:var(--cream);position:relative;overflow:hidden}
@media(min-width:500px){.app{height:min(100%,920px);align-self:center;border-radius:32px;box-shadow:0 20px 60px rgba(59,50,45,.25)}}
.scr{position:absolute;inset:0;overflow-y:auto;padding-bottom:110px}
.scr[hidden]{display:none}
.pad{position:relative;z-index:1;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* 裝飾 */
.burst{position:absolute;top:-52px;left:-70px;width:200px;height:200px;pointer-events:none;z-index:0}
.burst svg{width:100%;height:100%;fill:var(--green)}
.ghost{position:absolute;right:-40px;width:130px;height:130px;pointer-events:none;z-index:0;opacity:.85}
.ghost svg{width:100%;height:100%;fill:none;stroke:var(--blush);stroke-width:5}
.pill{position:absolute;right:0;top:72px;background:var(--green);color:var(--cream);font-family:var(--f-num);font-weight:800;font-size:16px;letter-spacing:.18em;padding:10px 18px 10px 24px;border-radius:40px 0 0 40px;z-index:3;font-variant-numeric:tabular-nums;transition:transform .25s}
.pill.pop{transform:scale(1.12)}
.hd{position:relative;height:150px;display:flex;align-items:flex-end;justify-content:center;z-index:2}
.hd h1{font-size:32px;font-weight:900;letter-spacing:.02em;position:relative;z-index:2;padding-bottom:18px}
.hd.sm h1{font-size:19px}
.logo{font-size:34px;font-weight:900;font-style:italic;transform:skewX(-8deg);letter-spacing:.06em;position:relative;z-index:2;padding-bottom:16px;display:flex}
.logo span{position:relative}
.logo span.sun::before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--red);top:-2px;left:12px;z-index:-1}
.sec-t{display:flex;justify-content:center;align-items:center;position:relative;margin:4px 0 14px;z-index:2}
.sec-t h2{font-size:21px;font-weight:900;letter-spacing:.4em;margin-right:-.4em}
.sec-t button{position:absolute;right:max(20px,env(safe-area-inset-right,0px));font-size:24px;color:var(--mute)}

/* 推薦輪播 */
.track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));scroll-padding-left:20px;position:relative;z-index:2}
.slide{flex:0 0 100%;scroll-snap-align:start;height:208px;border-radius:30px;overflow:hidden;display:grid;grid-template-columns:1.25fr 1fr;align-items:stretch;background:var(--red);text-align:left;cursor:pointer}
.slide.g{background:var(--green)}
.slide .l{background:transparent;color:var(--paper);padding:20px 12px 18px 20px;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:6px;border-radius:30px 0 0 30px;min-width:0}
.slide .r{background:var(--grey) center/cover;border-radius:30px;height:100%}
.loc{display:inline-flex;align-items:center;gap:4px;background:var(--paper);color:var(--ink);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.loc svg{width:11px;height:11px;fill:var(--green)}
.slide b{font-size:clamp(20px,6.4vw,27px);font-weight:900;line-height:1.15;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .m{font-size:13px;font-weight:700;font-family:var(--f-num)}
.otag{display:flex;gap:5px;flex-wrap:wrap}
.otag i{font-style:normal;font-size:11px;font-weight:700;border:1.5px solid currentColor;padding:2px 8px;border-radius:20px}
.go-btn{margin-top:auto;display:inline-flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);font-size:12px;font-weight:900;padding:5px 5px 5px 14px;border-radius:30px}
.arr{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:900}
.dots{display:flex;justify-content:center;gap:6px;padding:14px 0 18px}
.dots i{width:9px;height:9px;border-radius:5px;background:var(--grey);transition:width .3s,background .3s}
.dots i.on{width:22px;background:var(--green)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;position:relative;z-index:2}
.chip{white-space:nowrap;background:var(--paper);font-size:15px;font-weight:700;padding:10px 18px;border-radius:30px;transition:background .2s,color .2s}
.chip.on{background:var(--ink);color:var(--paper)}
.date{font-size:19px;font-weight:900;margin:20px 0 12px}
.date span{font-family:var(--f-num)}

/* 食記卡 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{cursor:pointer;border-radius:24px;padding:6px 6px 12px;background:linear-gradient(var(--paper) 55%,var(--cream));text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:0 0 0 1px rgba(59,50,45,.04)}
.card.hot{background:linear-gradient(var(--red) 55%,var(--blush));color:var(--paper)}
.ph{display:block;width:100%;aspect-ratio:1.2;border-radius:20px;background:var(--grey) center/cover;position:relative;max-width:100%}
.price{position:absolute;top:7px;right:7px;background:var(--ink);color:var(--paper);font-family:var(--f-num);font-weight:800;font-size:12px;padding:4px 9px;border-radius:20px}
.card h3{font-size:17px;font-weight:900;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:5px;padding:0 6px;flex-wrap:wrap}
.tg{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--grey);color:var(--ink)}
.card.hot .tg{background:var(--ink);color:var(--paper)}
.tg.o{background:none;border:1.5px solid currentColor;padding:2px 8px}
.card.hot .tg.o{background:none;color:var(--paper)}
.who{display:flex;align-items:center;gap:6px;padding:4px 6px 0;font-size:11px;color:var(--mute);min-width:0}
.card.hot .who{color:var(--paper)}
.av{width:22px;height:22px;flex:none;border-radius:50%;background:var(--red);color:var(--paper);display:grid;place-items:center;font-size:11px;font-weight:900}
.card.hot .av{background:var(--paper);color:var(--ink)}
.who em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.like{display:flex;align-items:center;gap:3px;font-family:var(--f-num);font-weight:800;font-size:14px;color:var(--ink)}
.card.hot .like{color:var(--paper)}
.like svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4}
.like.on svg{fill:#E86A55;stroke:#E86A55}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:30px 0;font-size:14px}

/* 導覽列 */
.nav{position:absolute;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:66px;border-radius:34px;background:var(--green);display:flex;align-items:center;justify-content:space-around;z-index:10}
.nav button{width:48px;height:48px;display:grid;place-items:center;color:var(--ink);transition:color .2s}
.nav button.on{color:var(--paper)}
.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.nav .plus{width:52px;height:52px;border-radius:50%;background:#F1EEEA;color:var(--ink)}
.nav .plus svg{width:24px;height:24px}

/* 尋找店家 */
.sbar{display:flex;gap:10px;position:relative;z-index:2}
.sbar input{flex:1;min-width:0;border:0;background:var(--paper);border-radius:30px;padding:15px 20px;font-size:15px}
.sbar input::placeholder{color:var(--mute)}
.sbar button{width:54px;height:54px;flex:none;border-radius:50%;background:var(--red);display:grid;place-items:center}
.sbar svg{width:24px;height:24px;stroke:var(--paper);stroke-width:3;fill:none;stroke-linecap:round}
.quick{display:flex;gap:8px;margin:12px 0 22px;overflow-x:auto}
.quick button{white-space:nowrap;background:var(--paper);font-size:13px;font-weight:700;padding:8px 14px;border-radius:30px}
.row-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.row-t h2{font-size:20px;font-weight:900}
.row-t span{font-size:13px;font-weight:700;color:var(--green);font-family:var(--f-num)}
.feat{background:var(--grey) center/cover;border-radius:30px;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;color:var(--ink);position:relative;z-index:2}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:var(--paper);font-size:12px;font-weight:900;padding:5px 12px;border-radius:20px}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--paper)}
.badge.off{background:var(--ink)}
.feat b{font-size:28px;font-weight:900;color:var(--paper)}
.feat.photo .ln{color:var(--paper)}.feat.photo .ln svg{stroke:var(--paper)}
.ln{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.ln svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2;flex:none}
.route{align-self:stretch;margin-top:8px;display:flex;align-items:center;background:var(--red);color:var(--paper);border-radius:30px;padding:8px 8px 8px 20px;font-weight:900;font-size:15px;gap:10px}
.route small{margin-left:auto;font-size:12px;font-weight:700}
.route .arr{width:32px;height:32px;background:var(--paper);color:var(--red);font-size:16px}
.srow{display:flex;align-items:center;gap:10px;width:100%;background:var(--red);border-radius:28px;padding:5px 14px 5px 5px;text-align:left;margin-bottom:8px}
.srow .in{flex:1;min-width:0;background:var(--paper);border-radius:24px;padding:9px 16px}
.srow b{display:block;font-size:16px;font-weight:900}
.srow small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow i{font-style:normal;background:var(--ink);color:var(--paper);font-size:12px;font-weight:900;padding:7px 12px;border-radius:20px;white-space:nowrap}
.srow.closed{background:var(--grey)}
.board{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.board > b{font-size:16px;font-weight:900;margin-right:4px}
.board button{background:linear-gradient(var(--ink),#5a4f48);color:var(--paper);font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px}
.board button span{color:var(--red)}
.board button.on{background:var(--red)}
.board button.on span{color:var(--paper)}

/* overlay 共用 */
.ov{position:absolute;inset:0;background:var(--cream);z-index:20;overflow-y:auto;padding-bottom:0;animation:up .28s ease}
.ov[hidden]{display:none}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.circ{position:absolute;top:58px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:4}
.circ svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.back{left:12px;color:var(--paper)}
.x{left:max(20px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--paper)}
.fav{right:max(20px,env(safe-area-inset-right,0px));background:var(--red);color:var(--paper)}
.fav svg{fill:none;stroke:var(--paper)}
.fav.on svg{fill:var(--paper)}
.hero{height:196px;border-radius:30px;background:var(--grey) center/cover;position:relative;overflow:visible;z-index:2}
.hero .loc{position:absolute;top:14px;left:14px;background:var(--ink);color:var(--paper);font-size:12px;padding:5px 12px}
.shot{position:absolute;right:-14px;bottom:-30px;width:150px;height:150px;display:grid;place-items:center}
.shot svg{position:absolute;inset:0;fill:var(--red)}
.shot span{position:relative;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.st-name{font-size:32px;font-weight:900;margin-top:22px}
.st-sub{font-size:13px;color:var(--mute);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 12px}
.stat{border-radius:24px;background:var(--red);padding:12px 14px 10px;position:relative;min-height:80px;display:flex;flex-direction:column;justify-content:space-between}
.stat.g{background:var(--grey)}
.stat b{font-family:var(--f-num);font-size:28px;font-weight:900;line-height:1}
.stat small{align-self:flex-end;font-size:12px;font-weight:900;color:var(--paper)}
.stat .ic{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:900}
.stat .star{position:absolute;top:10px;right:12px;fill:var(--paper);width:20px;height:20px}
.info{background:var(--paper);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;font-size:14px}
.info .ln{font-size:14px}
.info .dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
.info .dot.off{background:var(--red)}
.copy{margin-left:auto;font-size:11px;font-weight:700;color:var(--green);border:1.5px solid var(--green);border-radius:20px;padding:2px 9px}
.dia-t{display:flex;align-items:center;gap:8px;margin:22px 0 12px}
.dia-t h2{font-size:20px;font-weight:900}
.cnt{width:24px;height:24px;border-radius:50%;background:var(--red);color:var(--paper);font-family:var(--f-num);font-weight:800;font-size:13px;display:grid;place-items:center}
.dia-t button{margin-left:auto;font-size:13px;font-weight:700;color:var(--mute)}
.msg{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.msg .av{width:32px;height:32px;font-size:14px;margin-top:10px}
.msg .av.gr{background:var(--grey);color:var(--ink)}
.msg small{display:block;font-size:11px;color:var(--mute);font-weight:700;margin-bottom:4px}
.bb{background:var(--paper);border-radius:20px;padding:9px 14px;font-size:14px;line-height:1.5}
.cta{position:sticky;width:calc(100% - 2*max(20px,env(safe-area-inset-left,0px)));margin:24px auto 0;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--green);color:var(--paper);border-radius:34px;display:flex;align-items:center;padding:8px 8px 8px 24px;font-size:17px;font-weight:900;gap:10px;z-index:22;box-shadow:0 8px 20px rgba(47,118,96,.25)}
.cta small{margin-left:auto;font-size:13px;font-weight:700}
.cta .arr{width:44px;height:44px;background:var(--paper);color:var(--green);font-size:20px}
.cta.center{justify-content:center;padding:14px}
.ov .cta{margin-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sh .cta{position:static;width:100%}
.cta.center i{font-style:normal;background:var(--red);font-family:var(--f-num);font-weight:800;font-size:14px;letter-spacing:.12em;padding:5px 14px;border-radius:20px}

/* 記錄表單 */
.up{border:2.5px dashed var(--ink);border-radius:30px;background:var(--grey) center/cover;height:164px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;z-index:2}
.up.has{border-style:solid}
.up.has .upi{display:none}
.upi{display:flex;flex-direction:column;align-items:center;gap:6px}
.cam{width:62px;height:62px;position:relative;display:grid;place-items:center}
.cam svg.b{position:absolute;inset:0;fill:var(--red)}
.cam svg.c{position:relative;width:30px;height:26px}
.upi b{font-size:15px;font-weight:900}
.upb{display:flex;gap:12px}
.upb label{font-size:13px;font-weight:900;padding:7px 18px;border-radius:20px;background:var(--paper);cursor:pointer}
.upb label.dk{background:var(--ink);color:var(--paper)}
.upb input{position:absolute;width:1px;height:1px;opacity:0}
.fld{width:100%;border:0;background:var(--paper);border-radius:24px;padding:14px 18px;font-size:15px}
.fld::placeholder{color:var(--mute)}
.lb{display:block;font-size:14px;font-weight:900;margin:16px 0 8px}
.opts{display:flex;gap:8px;overflow-x:auto}
.opts button{white-space:nowrap;background:var(--paper);font-size:14px;font-weight:700;padding:11px 14px;border-radius:30px}
.opts button.on{background:var(--red);color:var(--paper)}
.pr-row{display:grid;grid-template-columns:.9fr 2fr;gap:10px;align-items:end}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rate button{background:var(--paper);border-radius:22px;padding:12px 4px;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:4px}
.rate button.on{background:var(--red);color:var(--paper)}
.rate svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.ta{position:relative}
.ta textarea{height:96px;resize:none;display:block}
.ta small{position:absolute;right:18px;bottom:10px;font-size:12px;color:var(--mute);font-family:var(--f-num)}

/* 點數 */
.wallet{background:var(--ink);color:var(--paper);border-radius:34px;padding:22px 22px 22px 28px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;margin-top:100px}
.wallet small{font-size:13px;opacity:.85}
.wallet b{display:block;font-family:var(--f-num);font-weight:900;font-size:64px;line-height:1.05;font-variant-numeric:tabular-nums}
.wbtn{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.wbtn button{color:var(--paper);font-weight:900;border-radius:24px;padding:9px 20px;font-size:14px;position:relative}
.wbtn .sg{background:var(--green)}
.wbtn .sg:disabled{opacity:.6}
.wbtn .sh{background:var(--red);padding:12px 32px;font-size:16px}
.streak{background:var(--red);border-radius:30px;padding:16px 16px 14px;margin-top:14px;color:var(--ink)}
.streak .h{display:flex;justify-content:space-between;align-items:center}
.streak h2{font-size:20px;font-weight:900}
.streak .h i{font-style:normal;background:var(--paper);font-size:12px;font-weight:900;padding:5px 12px;border-radius:20px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 10px;text-align:center;font-size:13px;font-weight:900}
.wk span{width:36px;height:36px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--paper)}
.wk span.miss{background:var(--grey)}
.wk span.today{background:none;border:3px solid var(--paper)}
.wk span.fut{background:none;border:2px dashed rgba(253,250,246,.6);color:transparent}
.wk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3}
.signed{width:100%;background:var(--grey);border-radius:24px;padding:9px;font-size:14px;font-weight:900}
.signed.ready{background:var(--paper);color:var(--red)}
.tk-h{display:flex;align-items:baseline;gap:12px;margin:24px 0 12px}
.tk-h h2{font-size:22px;font-weight:900}
.tk-h span{font-size:14px;font-weight:700;font-family:var(--f-num)}
.task{width:100%;display:flex;align-items:center;gap:10px;background:var(--ink);border-radius:26px;padding:5px 14px 5px 5px;margin-bottom:9px;text-align:left}
.task .in{flex:1;background:var(--paper);border-radius:22px;padding:8px 16px;min-width:0}

/* 寵物 */
.stage{margin-top:100px;height:300px;border-radius:34px;background:linear-gradient(var(--red),#E89A80 45%,var(--paper) 80%);position:relative;z-index:2;overflow:hidden}
.lv{position:absolute;top:-8px;left:20px;z-index:3;background:var(--ink);color:var(--paper);font-family:var(--f-num);font-weight:800;font-size:18px;padding:12px 16px 10px;border-radius:0 0 24px 24px}
.say{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:var(--paper);border:2px solid var(--ink);border-radius:24px;padding:7px 22px;font-size:14px;font-weight:900;white-space:nowrap;z-index:3;transition:transform .2s}
.say::after{content:"";position:absolute;bottom:-9px;left:46%;width:14px;height:14px;background:var(--paper);border:2px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg)}

.pet svg{width:min(300px,90%);height:auto}
.pet .body{transform-origin:150px 230px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) scaleY(1.02)}}
.pet.eat .body{animation:chomp .25s ease 4}
@keyframes chomp{50%{transform:scale(1.06,.94)}}
.spark{fill:var(--paper);animation:tw 2s ease-in-out infinite}
.spark.b{animation-delay:1s}

.spark{transform-box:fill-box;transform-origin:center}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.barc{background:var(--ink);color:var(--paper);border-radius:26px;padding:12px 16px 14px}
.barc .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}

.acts button{border-radius:30px;padding:13px;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
.acts .feed{background:var(--red);color:var(--paper)}
.acts .dress{background:var(--paper);color:var(--red);border:2px solid var(--red)}
.acts svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round}
.bag-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:20px 0 10px}
.bag-h h2{font-size:21px;font-weight:900;grid-column:2}
.bag-h span{justify-self:end;font-size:13px;color:var(--mute);font-weight:700}
.bag{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:var(--paper);border-radius:22px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;font-size:13px;font-weight:900}
.item .ic{width:60px;height:60px;border-radius:50%;background:var(--grey);display:grid;place-items:center}
.item .ic svg{width:44px;height:44px}

.item.zero{opacity:.45}

/* sheet / toast */
.sheet{position:absolute;inset:0;background:rgba(59,50,45,.45);z-index:40;display:flex;align-items:flex-end}

.sh{background:var(--cream);width:100%;border-radius:30px 30px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-height:80%;overflow-y:auto;animation:up .25s}

.pd .ph{aspect-ratio:1.6;margin-bottom:12px}

.cm{display:flex;gap:8px;margin-top:12px}
.cm input{flex:1;min-width:0}

.toast{position:absolute;left:50%;top:calc(24px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:30px;font-weight:700;font-size:14px;z-index:60;transition:transform .3s;white-space:nowrap}

.ntop{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--green);color:var(--paper);border-radius:28px;padding:14px 18px;display:flex;align-items:center;gap:14px}

.rrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rrow b{font-size:26px;font-weight:900}
.rrow span{font-size:12px;color:var(--mute);white-space:nowrap}
.rinfo .ln{font-size:13px}

.rg{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:900;margin:20px 0 10px}
.rg svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2}
.steps{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:14px}

.steps span{width:22px;height:22px;flex:none;border-radius:50%;background:var(--green);color:var(--paper);font-family:var(--f-num);font-weight:800;font-size:12px;display:grid;place-items:center}
.live{position:absolute;inset:0;z-index:35;background:var(--mland);overflow:hidden;animation:up .25s}
.live[hidden]{display:none}
.lmap{position:absolute;inset:0;width:100%;height:100%;display:block}

.live .ntop small{color:var(--mute);opacity:1}
.live .ntop.done{justify-content:center}
.lpill{position:absolute;top:calc(98px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12px;font-weight:900;padding:5px 14px;border-radius:20px;display:flex;align-items:center;gap:6px}
.lpill::after{content:"";width:8px;height:8px;border-radius:50%;background:#7FD3A8;animation:tw 1.2s infinite}
.lpill.off::after{background:var(--grey);animation:none}
.live .nbot{box-shadow:0 6px 20px rgba(59,50,45,.16);padding:10px 10px 10px 14px}
.live .nbot b{font-size:16px}
.wk2{width:30px;height:30px;color:var(--ink);flex:none}
.wk2 svg{width:100%;height:100%}
.pz{width:40px;height:40px;border-radius:50%;background:var(--cream);color:var(--ink);display:grid;place-items:center;flex:none}
.pz svg{width:16px;height:16px}
.live .nbot .end{background:var(--green);color:var(--paper);font-weight:900;border-radius:24px;padding:11px 16px;font-size:14px;white-space:nowrap}
.thumb{width:58px;height:58px;border-radius:14px;background:var(--grey) center/cover;flex:none}
.nbot.done small{display:block;font-size:12px;color:var(--mute)}
.nbot.done small:first-child{color:var(--green);font-weight:700}
/* 登入 */
.login{position:absolute;inset:0;background:var(--cream);z-index:50;overflow-y:auto;padding-bottom:30px}
.login[hidden]{display:none}
.lhero{height:190px;border-radius:34px;background:linear-gradient(160deg,var(--red),#E89A80 55%,var(--blush));position:relative;overflow:hidden;z-index:2}
.lhero svg.pet2{position:absolute;bottom:-46px;left:50%;transform:translateX(-50%);width:230px}
.lhero .say{top:18px}
.lh{font-size:28px;font-weight:900;text-align:center;margin:22px 0 4px;text-wrap:balance}
.lsub{text-align:center;font-size:13px;color:var(--mute);margin-bottom:6px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;width:100%;border:0;background:var(--paper);border-radius:24px;padding:14px 44px 14px 18px;font-size:15px;color:var(--ink);font-family:inherit}
.sel select:invalid{color:var(--mute)}
.sel::after{content:"";position:absolute;right:20px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.err{font-size:12px;color:var(--red);font-weight:700;min-height:18px;margin-top:6px}
.lgo{width:100%;margin-top:18px;background:var(--green);color:var(--paper);border-radius:34px;padding:17px;font-size:19px;font-weight:900;transition:opacity .2s}
.lgo:disabled{opacity:.45;cursor:default}
.who-me{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px;color:var(--mute)}
.who-me button{font-size:13px;font-weight:700;color:var(--red);border:1.5px solid var(--red);border-radius:20px;padding:4px 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 星形 ---------- */
function starPts(n,r1,r2,cx,cy,jit){let p=[];for(let i=0;i<n*2;i++){const r=i%2?r2:r1*(jit?1-((i*37)%5)/40:1),a=Math.PI*i/n-Math.PI/2;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1))}return p.join(' ')}
const starSVG=(n,r1,r2)=>`<svg viewBox="0 0 200 200" aria-hidden="true"><polygon points="${starPts(n,r1,r2,100,100,1)}"/></svg>`;
$$('[data-star]').forEach(e=>e.innerHTML=starSVG(9,98,52));
$$('[data-ghost]').forEach(e=>e.innerHTML=`<svg viewBox="0 0 200 200" aria-hidden="true"><polygon points="${starPts(7,92,48,100,100,1)}"/><path d="M78 90q4-8 8 0M110 84q4-8 8 0M86 112q14 12 28 0" stroke-linecap="round"/></svg>`);

const PIN='<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>';
const HEART='<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>';
const CLOCK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
const LPIN='<svg viewBox="0 0 24 24"><path d="M12 21s6.5-7 6.5-11.5a6.5 6.5 0 0 0-13 0C5.5 14 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>';
const PHONE='<svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>';
const FACE={推薦:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r=".8" fill="currentColor"/><circle cx="15" cy="10" r=".8" fill="currentColor"/><path d="M8.5 14q3.5 3.5 7 0"/></svg>',普通:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r=".8" fill="currentColor"/><circle cx="15" cy="10" r=".8" fill="currentColor"/><path d="M9 15h6"/></svg>',踩雷:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r=".8" fill="currentColor"/><circle cx="15" cy="10" r=".8" fill="currentColor"/><path d="M8.5 16q3.5-3.5 7 0"/></svg>'};

/* ---------- 道具圖示 ---------- */

let tT;
function toast(h){const t=$('#toast');t.innerHTML=h;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),1900)}
function addPts(n,why){S.pts+=n;S.week+=n;save();paintPts();$$('[data-pts]').forEach(p=>{p.classList.add('pop');setTimeout(()=>p.classList.remove('pop'),250)});toast(`${why} <b>+${n} P</b>`)}
function paintPts(){$$('[data-pts]').forEach(p=>p.textContent=S.pts+' P')}
function doTask(k){const T=TASKS.find(t=>t.k===k);if(S.tasks[k]>=T.max)return false;S.tasks[k]++;save();return true}
const mins=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
function isOpen(s,d=new Date()){const n=d.getHours()*60+d.getMinutes(),o=mins(s.open),c=mins(s.close);return c>o?n>=o&&n<c:n>=o||n<c}
const store=id=>STORES.find(s=>s.id===id);
const me=()=>S.user||{nick:'我',dept:'大同'};
const hhmm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function openSheet(h){$('#shBody').innerHTML='<div class="grab"></div>'+h;$('#sheet').hidden=false}
function closeSheet(){$('#sheet').hidden=true}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

 ({home:renderHome,search:renderSearch,points:renderPoints,pet:renderPet})[p]();$('#s-'+p).scrollTop=0}

let auto=setInterval(()=>{if(cur!=='home'||!$('#o-store').hidden)return;const t=$('#track'),w=t.firstElementChild.offsetWidth+12,n=t.children.length,i=Math.round(t.scrollLeft/w);t.scrollTo({left:((i+1)%n)*w,behavior:'smooth'})},4500);

document.addEventListener('click',e=>{

 if(lk){e.stopPropagation();const id=lk.dataset.like;S.liked[id]=!S.liked[id];save();renderFeed();return}

});

let board='';
function renderSearch(){
 $('#quick').innerHTML=['CP值高 · $100內','晴光市場','校內學餐','校門口'].map(q=>`<button data-q="${q}">${q}</button>`).join('');
 $('#sIn').value='';board='';renderDefaultSearch();

function srow(s,now=new Date()){const o=isOpen(s,now);return `<button class="srow ${o?'':'closed'}" data-store="${s.id}"><span class="in"><b>${esc(s.name)}${o?'':' <small style="display:inline;color:var(--red)">· 休息中</small>'}</b><small>均價 $${s.avg} · ★ ${s.rating} · ${esc(s.tags.join('、'))}</small></span><i>${s.walk} 分鐘</i></button>`}
function renderDefaultSearch(){
 const now=new Date(),open=STORES.filter(s=>isOpen(s,now)).sort((a,b)=>a.walk-b.walk),f=open[0];
 const rest=STORES.filter(s=>s!==f).sort((a,b)=>isOpen(b,now)-isOpen(a,now)||a.walk-b.walk).slice(0,3);
 $('#sBody').innerHTML=`<div class="row-t"><h2>營業中的店家</h2><span>現在 ${hhmm(now)}</span></div>
 ${f?`<div class="feat ${IMG[f.img]?'photo':''}" ${IMG[f.img]?`style="background-image:linear-gradient(rgba(59,50,45,.35),rgba(59,50,45,.7)),url(${IMG[f.img]})"`:''}><span class="badge">營業中</span><b>${esc(f.name)}</b>
   <span class="ln">${CLOCK}${f.open} 開始 · ${f.close} 打烊</span><span class="ln">${LPIN}${esc(f.addr)}</span>
   <button class="route" data-nav="${f.id}">查看路線<small>步行 ${f.walk} 分鐘</small><span class="arr">→</span></button>
   <button style="position:absolute;inset:0 0 80px;" data-store="${f.id}" aria-label="查看 ${esc(f.name)}"></button></div>`
  :'<div class="feat"><span class="badge off">都打烊了</span><b>現在沒有營業中的店</b><span class="ln">明天 10:00 起陸續開門</span></div>'}
 <div class="row-t" style="margin-top:22px"><h2>附近也不錯</h2></div>${rest.map(s=>srow(s,now)).join('')}
 <div class="board"><b># 主題板</b>${['附圖吃飯','踩雷警報','百元內'].map(t=>`<button data-board="${t}"><span>#</span> ${t}</button>`).join('')}</div>`;
}
function doSearch(q){
 q=q.trim();if(!q){renderDefaultSearch();return}
 let list=STORES.slice(),cap=(q.match(/\$?\s*(\d{2,4})\s*(元)?\s*內/)||q.match(/\$(\d{2,4})/)||[])[1];
 if(cap)list=list.filter(s=>s.avg<=+cap);
 const words=q.replace(/CP\s*值?高|\$?\d+\s*元?內?|的店|·|、|，/gi,' ').split(/\s+/).filter(Boolean);
 words.forEach(w=>{const n=w.replace('－','').replace('-','');list=list.filter(s=>{if(w==='宵夜')return s.night;const hay=(s.name+s.area+s.tags.join('')+s.sub).replace('－','');return hay.includes(n)||(n==='校內學餐'&&s.area==='校內－學餐')})});
 if(/CP/i.test(q))list.sort((a,b)=>b.rating/b.avg-a.rating/a.avg);else list.sort((a,b)=>a.walk-b.walk);
 $('#sBody').innerHTML=`<div class="row-t"><h2>「${esc(q)}」的結果</h2><span>${list.length} 間</span></div>`+(list.length?list.map(s=>srow(s)).join(''):'<div class="empty">找不到符合的店家，換個關鍵字試試，或發一篇日記分享新店家 +20 P。</div>')+
  `<div class="board"><button data-clear style="background:var(--paper);color:var(--ink)">← 回到推薦</button></div>`;
}
function renderBoard(t){
 let list=t==='附圖吃飯'?S.posts.filter(p=>pimg(p)):t==='踩雷警報'?S.posts.filter(p=>p.rate==='踩雷'):S.posts.filter(p=>p.price<100);
 $('#sBody').innerHTML=`<div class="row-t"><h2># ${t}</h2><span>${list.length} 篇</span></div><div class="grid">${list.map((p,i)=>`<div class="card ${i%2?'hot':''}" data-post="${p.id}" role="button" tabindex="0"><div class="ph" ${bg(pimg(p))}><span class="price">NT$${p.price}</span></div><h3>${esc(p.food)}</h3><div class="tags"><span class="tg">${esc(p.area)}</span><span class="tg o">${p.rate}</span></div></div>`).join('')||'<div class="empty">還沒有文章</div>'}</div>
 <div class="board"><button data-clear style="background:var(--paper);color:var(--ink)">← 回到推薦</button></div>`;
}
$('#sForm').onsubmit=e=>{e.preventDefault();doSearch($('#sIn').value)};
$('#s-search').addEventListener('click',e=>{
 const q=e.target.closest('[data-q]');if(q){$('#sIn').value=q.dataset.q;doSearch(q.dataset.q);return}
 const b=e.target.closest('[data-board]');if(b){renderBoard(b.dataset.board);return}
 if(e.target.closest('[data-clear]')){$('#sIn').value='';renderDefaultSearch()}
});
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){e.stopPropagation();openNav(n.dataset.nav)}},true);

/* ---------- 點數任務 ---------- */
const WD=['一','二','三','四','五','六','日'];
function renderPoints(){
 const t=(new Date().getDay()+6)%7;
 S.hist=S.hist||[];const done=TASKS.filter(k=>S.tasks[k.k]>=k.max).length;
 const days=WD.map((w,i)=>{let c=i<t?(i===3&&t>3?'miss':''):i===t?(S.signed?'':'today'):'fut';return `<div><span class="${c}"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></span>${w}</div>`}).join('');
 let streak=0;for(let i=t;i>=0;i--){if(i===t&&!S.signed)continue;if(i===3&&t>3)break;streak++}
 $('#pBody').innerHTML=`<div class="wallet"><div><small>我的點數</small><b id="bigPts">${S.pts}</b><small>本週已賺 +${S.week}</small></div>
  <div class="wbtn"><button class="sg" id="sign" ${S.signed?'disabled':''}>${S.signed?'已簽到':'簽到 +2'}</button><button class="sh" id="shop">商店</button></div></div>

   $('#lTurn').innerHTML=rt?IC.right:IC.left;$('#lDist').textContent=toNext<12?`現在${rt?'右':'左'}轉`:`${Math.round(toNext)} m 後${rt?'右':'左'}轉`}

  $('#lSub').textContent=`路線還剩 ${mins2(left)} 分鐘・直線約 ${Math.round(dist(p,SPOT[s.id]))} m`;
  $('#lEta').textContent=`約 ${mins2(left)} 分鐘左右`;
  navT=requestAnimationFrame(frame)};
 navT=requestAnimationFrame(frame);
}
function arrive(s){
 $('#lTop').classList.add('done');$('#lTop').innerHTML='<b>已抵達目的地</b>';$('#lPill').hidden=true;
 const ph=IMG[s.img];
 $('#lBot').classList.add('done');
 $('#lBot').innerHTML=`<span class="thumb" ${bg(ph)}></span><div><small>（${isOpen(s)?'營業中':'休息中'}）</small><b>${esc(s.name)}</b><small>${esc(s.area)}</small></div><button class="end" id="lEnd">結束導航</button>`;
 $('#lEnd').onclick=()=>{$('#live').hidden=true;$('#o-nav').hidden=true};
}

/* ---------- 登入 ---------- */
function showLogin(){
 const o=$('#o-login');o.hidden=false;o.scrollTop=0;$('#nav').hidden=true;
 $('#lPet').innerHTML=petSVG().replace('<svg','<svg class="pet2"');
 ['lId','lNick'].forEach(i=>$('#'+i).value='');$('#lDept').value='';check();
}
function check(){
 const id=$('#lId').value.trim(),d=$('#lDept').value,n=$('#lNick').value.trim();
 let e='';if(id&&!/^[A-Za-z0-9]{5,12}$/.test(id))e='學號請輸入 5–12 位英文或數字';
 $('#lErr').textContent=e;$('#lGo').disabled=!(id&&d&&n&&!e);
}
['lId','lNick'].forEach(i=>$('#'+i).addEventListener('input',check));$('#lDept').addEventListener('change',check);
$('#lId').addEventListener('input',e=>e.target.value=e.target.value.replace(/[^A-Za-z0-9]/g,''));
$('#lF').onsubmit=e=>{e.preventDefault();check();if($('#lGo').disabled)return;
 S.user={id:$('#lId').value.trim(),dept:$('#lDept').value,nick:$('#lNick').value.trim()};save();
 $('#o-login').hidden=true;$('#nav').hidden=false;go('home');toast(`歡迎，${esc(S.user.nick)}！`)};
$('#o-login [data-star]').innerHTML=starSVG(9,98,52);

document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'&&!t.dataset.like){e.preventDefault();t.click()}});
paintPts();
if(S.user)go('home');else{go('home');showLogin()}
})();
</script>
